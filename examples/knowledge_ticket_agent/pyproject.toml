[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-ticket-agent-demo"
version = "0.1.0"
description = "Fictional knowledge and ticket Agent Demo with offline Mock execution."
requires-python = ">=3.11,<3.13"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["agent-harness-lab==0.9.0"]

[project.optional-dependencies]
web = ["fastapi==0.162.0", "uvicorn==0.54.0"]
semantic = ["onnxruntime==1.31.1", "tokenizers==0.23.3"]

[project.scripts]
lqd-web = "knowledge_ticket_agent.web_app:main"
lqd-agent-demo = "knowledge_ticket_agent.business_demo:main"
lqd-validate = "knowledge_ticket_agent.cli:main"
lqd-search = "knowledge_ticket_agent.retrieval_cli:main"
lqd-search-v2 = "knowledge_ticket_agent.retrieval_v2_cli:main"
lqd-retrieval-dev = "knowledge_ticket_agent.retrieval_dev:main"
lqd-retrieval-eval = "knowledge_ticket_agent.retrieval_eval:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
knowledge_ticket_agent = ["py.typed", "web_static/*", "semantic-model.json", "pair-model.json", "resources/v1/*.json", "resources/v1/documents/*.md", "resources/v1/tickets/*.json"]

[tool.uv.sources]
agent-harness-lab = { path = "../..", editable = false }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra --import-mode=importlib"
filterwarnings = ["error"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.11"
strict = true
